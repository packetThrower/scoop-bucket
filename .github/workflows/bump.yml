name: Bump manifests on new release

# Polls every manifest's `checkver` source every 6 hours and, when a
# newer version is available, downloads the matching artifacts,
# recomputes hashes, rewrites the manifest in place, and pushes the
# bump commit straight to main. Manual runs supported via
# workflow_dispatch.
#
# Uses Scoop's first-party tooling (checkver.ps1 / formatjson.ps1)
# rather than hand-rolled sed so URL-template rules, hash strategies,
# JSON formatting, etc. all match what `scoop install` expects.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-manifests
  cancel-in-progress: false

jobs:
  bump:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Scoop
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force
          irm get.scoop.sh -outfile install.ps1
          .\install.ps1 -RunAsAdmin

      - name: Run checkver -Update on every manifest
        shell: powershell
        run: |
          $scoopRoot = "$env:USERPROFILE\scoop\apps\scoop\current"
          & "$scoopRoot\bin\checkver.ps1" -Dir bucket -Update

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain bucket)" ]; then
            echo "No manifest changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket
          git commit -m "Bump manifests via checkver -Update"
          git push
